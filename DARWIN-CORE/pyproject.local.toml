[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-torch"
version = "2.1.0"
description = "DARWIN Torch Plugin — Local vision and heavy embedding models"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.49.0,<5.0.0",
    "sentence-transformers>=5.3.0",
    "accelerate>=0.25.0",
]

[tool.setuptools]
py-modules = []