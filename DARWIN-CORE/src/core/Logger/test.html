<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darwin Terminal — Web UI</title>
    <style>
        :root {
            --bg: #0c0c0c;
            --surface: #141414;
            --text: #c0c0c0;
            --dim: #666;
            --cyan: #00d4d4;
            --green: #00d700;
            --yellow: #d7af00;
            --red: #d70000;
            --accent: #5f5fff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- header --- */
        #header {
            background: var(--surface);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        #status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--dim);
            transition: background 0.3s;
        }
        #status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
        #status-dot.disconnected { background: var(--red); box-shadow: 0 0 8px var(--red); }

        #status-text { font-size: 12px; color: var(--dim); }

        #header input {
            flex: 1;
            background: var(--bg);
            border: 1px solid #333;
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        #header input:focus { border-color: var(--cyan); }

        #header button {
            background: var(--surface);
            border: 1px solid #444;
            color: var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
        }
        #header button:hover { background: #222; border-color: var(--cyan); }

        /* --- terminal body --- */
        #terminal {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .line.info    { color: var(--text); }
        .line.success { color: var(--green); }
        .line.warning { color: var(--yellow); }
        .line.error   { color: var(--red); }
        .line.banner  { color: var(--cyan); font-size: 13px; line-height: 1.15; }
        .line.system  { color: var(--dim); font-style: italic; }

        /* --- progress bars --- */
        .progress-block {
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .progress-bar-outer {
            flex: 1;
            height: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: var(--cyan);
            border-radius: 4px;
            transition: width 0.2s ease-out;
        }
        .progress-label { color: var(--cyan); min-width: 140px; }
        .progress-pct { color: var(--dim); min-width: 45px; text-align: right; }

        /* --- spinner --- */
        .spinner-block {
            margin: 2px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--cyan);
        }
        .spinner-icon {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- prompt modal --- */
        #prompt-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        #prompt-overlay.active { display: flex; }

        #prompt-box {
            background: var(--surface);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            min-width: 360px;
            max-width: 500px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }

        #prompt-message { color: var(--yellow); font-size: 15px; margin-bottom: 16px; }

        .prompt-option {
            display: block;
            width: 100%;
            background: var(--bg);
            border: 1px solid #333;
            color: var(--text);
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            transition: background 0.2s, border-color 0.2s;
        }
        .prompt-option:hover { background: #1a1a1a; border-color: var(--cyan); }
        .prompt-option:active { background: #222; }

        /* --- structured tree --- */
        .struct-tree {
            margin: 4px 0 4px 1.5em;
            font-size: 13px;
            line-height: 1.6;
        }
        .struct-node { margin-left: 1.2em; }
        .struct-toggle {
            cursor: pointer;
            user-select: none;
            margin-right: 4px;
            color: var(--cyan);
        }
        .struct-type {
            color: var(--green);
            font-weight: bold;
        }
        .struct-key { color: var(--accent); }
        .struct-leaf { color: var(--dim); }
        .struct-list-header { color: var(--cyan); margin: 2px 0; }

        /* --- custom component cards --- */
        .struct-card {
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            margin: 4px 0;
            background: #1a1a1a;
        }
        .struct-card-header {
            font-weight: bold;
            color: var(--green);
            margin-bottom: 4px;
        }
        .struct-card-field {
            margin-left: 1em;
            color: var(--text);
        }
        .struct-card-field-name {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div id="header">
        <div id="status-dot" class="disconnected"></div>
        <span id="status-text">disconnected</span>
        <input id="ws-url" type="text" value="ws://localhost:8765" placeholder="WebSocket URL">
        <button id="btn-connect">connect</button>
    </div>

    <!-- TERMINAL OUTPUT -->
    <div id="terminal"></div>

    <!-- PROMPT MODAL -->
    <div id="prompt-overlay">
        <div id="prompt-box">
            <div id="prompt-message"></div>
            <div id="prompt-options"></div>
        </div>
    </div>

<script>
    // =========================================================================
    // DOM refs
    // =========================================================================
    const statusDot   = document.getElementById('status-dot');
    const statusText  = document.getElementById('status-text');
    const wsUrlInput  = document.getElementById('ws-url');
    const btnConnect  = document.getElementById('btn-connect');
    const terminal    = document.getElementById('terminal');
    const promptOverlay = document.getElementById('prompt-overlay');
    const promptMsg   = document.getElementById('prompt-message');
    const promptOpts  = document.getElementById('prompt-options');

    let ws = null;
    let pendingPromptId = null;
    let currentSession = '';

    // =========================================================================
    // Helpers
    // =========================================================================
    function setStatus(state) {
        statusDot.className = state;
        statusText.textContent = state;
        btnConnect.textContent = state === 'connected' ? 'disconnect' : 'connect';
    }

    function appendElement(el) {
        terminal.appendChild(el);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function appendLine(text, cls = 'system') {
        const div = document.createElement('div');
        div.className = `line ${cls}`;
        div.textContent = text;
        appendElement(div);
    }

    // Progress trackers
    const progressEls = {};

    function renderProgressStart(id, label, total) {
        const container = document.createElement('div');
        container.className = 'progress-block';
        container.id = `prog-${id}`;

        const labelSpan = document.createElement('span');
        labelSpan.className = 'progress-label';
        labelSpan.textContent = label;

        const outer = document.createElement('div');
        outer.className = 'progress-bar-outer';
        const inner = document.createElement('div');
        inner.className = 'progress-bar-inner';
        inner.style.width = '0%';
        outer.appendChild(inner);

        const pctSpan = document.createElement('span');
        pctSpan.className = 'progress-pct';
        pctSpan.textContent = '0%';

        container.appendChild(labelSpan);
        container.appendChild(outer);
        container.appendChild(pctSpan);
        appendElement(container);

        progressEls[id] = { outer, inner, pctSpan, total, container };
    }

    function renderProgressUpdate(id, current, status) {
        const el = progressEls[id];
        if (!el) return;
        const pct = el.total > 0 ? Math.round((current / el.total) * 100) : 0;
        el.inner.style.width = pct + '%';
        el.pctSpan.textContent = pct + '%';
        if (status) {
            el.container.querySelector('.progress-label').textContent = status;
        }
    }

    function renderProgressEnd(id) {
        const el = progressEls[id];
        if (!el) return;
        el.inner.style.width = '100%';
        el.pctSpan.textContent = '100%';
        el.container.style.opacity = '0.6';
        delete progressEls[id];
    }

    // Spinner helpers
    const spinners = {};

    function appendSpinner(id, message) {
        const div = document.createElement('div');
        div.className = 'spinner-block';
        div.id = `spinner-${id}`;
        div.innerHTML = `<span class="spinner-icon">⏳</span> ${message}`;
        appendElement(div);
        spinners[id] = div;
    }

    function updateSpinner(id, message) {
        const div = spinners[id];
        if (div) {
            div.innerHTML = `<span class="spinner-icon">⏳</span> ${message}`;
        }
    }

    function removeSpinner(id, success) {
        const div = spinners[id];
        if (div) {
            div.innerHTML = success ? '  Done' : '❌ Failed';
            div.style.opacity = '0.6';
            delete spinners[id];
        }
    }

    // =========================================================================
    // Schema & Component Registry
    // =========================================================================
    const schemaRegistry = {};        // typeName -> schemaDefinition
    const componentRegistry = {};     // typeName -> renderFunction(data, schema) => HTMLElement

    function registerSchema(typeName, schemaDef) {
        schemaRegistry[typeName] = schemaDef;
    }

    function registerComponent(typeName, renderFunc) {
        componentRegistry[typeName] = renderFunc;
    }

    // =========================================================================
    // Structured rendering with component fallback
    // =========================================================================
    function renderStructured(data, container = null, depth = 0) {
        if (!container) {
            container = document.createElement('div');
            container.className = 'struct-tree';
        }

        if (data === null || data === undefined) {
            const span = document.createElement('span');
            span.className = 'struct-leaf';
            span.textContent = 'null';
            container.appendChild(span);
            return container;
        }
        if (typeof data !== 'object') {
            const span = document.createElement('span');
            span.className = 'struct-leaf';
            span.textContent = JSON.stringify(data);
            container.appendChild(span);
            return container;
        }

        // Array fallback
        if (Array.isArray(data)) {
            const header = document.createElement('div');
            header.className = 'struct-list-header';
            header.textContent = `list (${data.length} items)`;
            container.appendChild(header);
            data.forEach((item, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'struct-node';
                const label = document.createElement('span');
                label.className = 'struct-key';
                label.textContent = `[${idx}] `;
                itemDiv.appendChild(label);
                renderStructured(item, itemDiv, depth+1);
                container.appendChild(itemDiv);
            });
            return container;
        }

        const darwinType = data.__darwin_type__;
        const isList = darwinType === 'list';
        if (isList) {
            const items = data.items || [];
            const header = document.createElement('div');
            header.className = 'struct-list-header';
            header.innerHTML = `<span class="struct-type">list</span> (${items.length} items)`;
            container.appendChild(header);
            items.forEach((item, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'struct-node';
                const label = document.createElement('span');
                label.className = 'struct-key';
                label.textContent = `[${idx}] `;
                itemDiv.appendChild(label);
                renderStructured(item, itemDiv, depth+1);
                container.appendChild(itemDiv);
            });
            return container;
        }

        // If we have a registered component for this type, delegate entirely
        if (darwinType && componentRegistry[darwinType]) {
            const comp = componentRegistry[darwinType](data, schemaRegistry[darwinType] || null);
            container.appendChild(comp);
            return container;
        }

        // Generic collapsible tree (fallback)
        const toggle = document.createElement('span');
        toggle.className = 'struct-toggle';
        toggle.textContent = '▼';
        const wrapper = document.createElement('div');
        wrapper.className = 'struct-node';
        wrapper.style.display = 'block';

        toggle.addEventListener('click', () => {
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                toggle.textContent = '▼';
            } else {
                wrapper.style.display = 'none';
                toggle.textContent = '▶';
            }
        });
        container.appendChild(toggle);

        if (darwinType && darwinType !== 'cycle') {
            const typeSpan = document.createElement('span');
            typeSpan.className = 'struct-type';
            typeSpan.textContent = darwinType;
            container.appendChild(typeSpan);
            container.appendChild(document.createTextNode(' '));
        }

        Object.keys(data).forEach(key => {
            if (key === '__darwin_type__') return;
            const row = document.createElement('div');
            const keySpan = document.createElement('span');
            keySpan.className = 'struct-key';
            keySpan.textContent = key + ': ';
            row.appendChild(keySpan);
            renderStructured(data[key], row, depth+1);
            wrapper.appendChild(row);
        });
        container.appendChild(wrapper);
        return container;
    }

    // =========================================================================
    // Message handler (updated to store schemas)
    // =========================================================================
    function handleMessage(raw) {
        let msg;
        try { msg = JSON.parse(raw); } catch (e) { return; }

        switch (msg.type) {
            case 'log': {
                const p = msg.payload || {};
                // Store schemas if sent
                if (p.schemas) {
                    Object.entries(p.schemas).forEach(([name, def]) => {
                        registerSchema(name, def);
                    });
                }
                const logClass = p.log_type || 'info';
                if (p.structured_data) {
                    const container = document.createElement('div');
                    container.className = `line ${logClass}`;
                    const header = document.createElement('div');
                    header.textContent = `[${p.format || 'structured'}]`;
                    header.style.color = 'var(--cyan)';
                    container.appendChild(header);
                    renderStructured(p.structured_data, container);
                    appendElement(container);
                } else {
                    appendLine(p.message || '', logClass);
                }
                break;
            }
            case 'progress':
                const pp = msg.payload;
                if (pp.event === 'start') {
                    renderProgressStart(pp.id, pp.label, pp.total);
                } else if (pp.event === 'update') {
                    renderProgressUpdate(pp.id, pp.current, pp.status);
                } else if (pp.event === 'end') {
                    renderProgressEnd(pp.id);
                }
                break;
            case 'spinner':
                const sp = msg.payload;
                if (sp.event === 'start') {
                    appendSpinner(sp.id, sp.message);
                } else if (sp.event === 'update') {
                    updateSpinner(sp.id, sp.message);
                } else if (sp.event === 'end') {
                    removeSpinner(sp.id, sp.success);
                }
                break;
            case 'session':
                const ss = msg.payload;
                if (ss.event === 'start') {
                    currentSession = ss.name;
                    appendLine(`session started: ${ss.name}`, 'system');
                } else if (ss.event === 'end') {
                    currentSession = '';
                    appendLine(`session ended: ${ss.name}`, 'system');
                }
                break;
            default:
                appendLine(`unknown message type: ${msg.type}`, 'warning');
        }
    }

    // =========================================================================
    // Example: register a custom component for "User"
    // =========================================================================
    registerComponent('User', (data, schema) => {
        const card = document.createElement('div');
        card.className = 'struct-card';
        const header = document.createElement('div');
        header.className = 'struct-card-header';
        header.textContent = 'User Card';
        card.appendChild(header);
        if (schema && schema.fields) {
            schema.fields.forEach(field => {
                const row = document.createElement('div');
                row.className = 'struct-card-field';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'struct-card-field-name';
                nameSpan.textContent = field.name + ': ';
                const valSpan = document.createElement('span');
                valSpan.textContent = data[field.name] !== undefined ? data[field.name] : 'N/A';
                row.appendChild(nameSpan);
                row.appendChild(valSpan);
                card.appendChild(row);
            });
        } else {
            Object.keys(data).forEach(key => {
                if (key === '__darwin_type__') return;
                const row = document.createElement('div');
                row.className = 'struct-card-field';
                row.textContent = key + ': ' + data[key];
                card.appendChild(row);
            });
        }
        return card;
    });

    // =========================================================================
    // WebSocket connect / disconnect
    // =========================================================================
    function connect() {
        if (ws && ws.readyState !== WebSocket.CLOSED) {
            ws.close();
            return;
        }

        const url = wsUrlInput.value.trim() || 'ws://localhost:8765';
        ws = new WebSocket(url);

        ws.onopen = () => {
            setStatus('connected');
            appendLine('connected to darwin', 'success');
            ws.send(JSON.stringify({ type: 'get_history', payload: { limit: 200 } }));
        };

        ws.onmessage = (e) => handleMessage(e.data);

        ws.onerror = () => appendLine('websocket error', 'error');

        ws.onclose = () => {
            setStatus('disconnected');
            appendLine('disconnected', 'system');
            ws = null;
            hidePrompt();
        };
    }

    btnConnect.addEventListener('click', connect);

    wsUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connect();
    });

    // Auto-connect on load
    connect();

    // =========================================================================
    // Prompt modal (kept for future use)
    // =========================================================================
    function showPrompt(promptId, message, options) {
        pendingPromptId = promptId;
        promptMsg.textContent = message;
        promptOpts.innerHTML = '';
        options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'prompt-option';
            btn.textContent = opt.label || opt;
            btn.addEventListener('click', () => {
                ws.send(JSON.stringify({
                    type: 'prompt_response',
                    payload: { id: promptId, choice: idx }
                }));
                hidePrompt();
            });
            promptOpts.appendChild(btn);
        });
        promptOverlay.classList.add('active');
    }

    function hidePrompt() {
        promptOverlay.classList.remove('active');
        pendingPromptId = null;
    }
</script>
</body>
</html>
