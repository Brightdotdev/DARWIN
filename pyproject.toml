[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-rag"
version = "0.2.19"
description = "Local-first RAG knowledge base with hybrid search (BM25 + embeddings), exposed to AI agents via MCP — fully offline-capable."
authors = [{name = "Brightdotdev", email = "mail.bright.dev@gmail.com"}]
readme = "README.md"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "knowledge-base",
    "knowledgebase",
    "mcp",
    "model-context-protocol",
    "llm",
    "ai-agent",
    "embedding",
    "vector-search",
    "bm25",
    "hybrid-search",
    "semantic-search",
    "local-ai",
    "offline",
    "private",
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Markup",
    "Operating System :: OS Independent",
]

dependencies = [
    # ── API Routing ──
    "litellm==1.83.14",
    "onnxruntime>=1.17.0",
    # ── Array & Data ──
    "numpy>=1.24.0",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    # ── ML & Graph ──
    "scikit-learn>=1.8.0",
    # ── Vector DB ──
    "usearch>=2.25.1",
    # ── Document Parsing ──
    "markitdown>=0.1.5",
    "pymupdf==1.27.2.2",
    "pymupdf4llm==1.27.2.2",
    "trafilatura>=2.0.0",
    "openpyxl>=3.1.5",
    "pyexcel-ods>=0.6.0",
    # ── Utilities ──
    "rich>=14.3.3",
    "psutil>=7.2.2",
    "jinja2>=3.1.6",
    "tiktoken>=0.12.0",
    "beautifulsoup4>=4.12.0",
    "websockets>=16.0",
    "filelock>=3.13.0",
    # ── HuggingFace Hub (for downloading ONNX models) ──
    "huggingface-hub>=0.20.0",
    # ── GPU Detection (no torch) ──
    "gputil>=1.4.0",
    "keyring>=25.7.0",
    "httpx>=0.28.1",
    "rapidocr-onnxruntime>=1.4.4",
    "tokenizers>=0.22.2",
    "pillow>=12.2.0",
    "sentencepiece>=0.2.1",
    "rapidocr>=3.8.4",
    "pyvis>=0.3.2",
    "nvidia-ml-py>=13.610.43",
    "sse-starlette>=2.2.0",
    "starlette>=1.3.0",
    "uvicorn>=0.50.0",
    "fastmcp>=3.4.2",
    "click>=8.1.0,<9.0",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8.14", "pytextrank>=3.3.0", "networkx>=3.4"]

[project.scripts]
darwin = "cli:main"
darwin-admin = "admin.cli:main"

[project.urls]
Homepage = "https://github.com/Brightdotdev/DARWIN"
Repository = "https://github.com/Brightdotdev/DARWIN"
Issues = "https://github.com/Brightdotdev/DARWIN/issues"
Documentation = "https://github.com/Brightdotdev/DARWIN/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "lib*", "darwin_mcp*", "admin*", "features*", "cli*"]
exclude = ["agent*", "pdfs*", "__pycache__*"]

[tool.setuptools.package-data]
"darwin_mcp" = ["*.html", "docs/*.md"]

[tool.deptry.package_module_name_map]
beautifulsoup4 = ["bs4"]
