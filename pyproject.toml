[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DARWIN"
version = "0.1.0"
description = "DARWIN-CLI a SOTA RAG ai agent for your personal and local use, it has both llm api support and bring your own model support too"
authors = [
    {name = "Brightdotdev", email = "mail.bright.dev@gmail.com"},
    {name = "Akinola Bright", email = "iamtherealbright@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "blingfire==0.1.8",
    "keyring>=25.7.0",
    "litellm>=1.83.0",
    "markitdown>=0.1.5",
    "networkx>=3.6.1",
    "nltk>=3.9.4",
    "pillow>=12.2.0",
    "pymupdf4llm>=1.27.2.2",
    "pytest>=9.0.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyvis>=0.3.2",
    "questionary>=2.1.1",
    "rank-bm25>=0.2.2",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "textual>=8.2.3",
    "toml>=0.10.2",
    "transformers>=4.49.0,<5.0.0",
    "typer>=0.24.1",
    "usearch>=2.25.1",
    "yake>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
darwin = "agent:app"
