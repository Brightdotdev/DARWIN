[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-core"
version = "0.2.0"
description = "DARWIN  — Local-first RAG engine with API + ONNX embedding support"
authors = [{name = "Brightdotdev", email = "mail.bright.dev@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ── API Routing ──
    "litellm>=1.83.0",
    "onnxruntime>=1.17.0",
    # ── Array & Data ──
    "numpy>=1.24.0",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    # ── ML & Graph ──
    "scikit-learn>=1.8.0",
    # ── Vector DB ──
    "usearch>=2.25.1",
    # ── NLP (spaCy, no models bundled) ──
    "spacy>=3.8.14",
    # ── Document Parsing ──
    "markitdown>=0.1.5",
    "pymupdf==1.27.2.2",
    "pymupdf4llm==1.27.2.2",
    "trafilatura>=2.0.0",
    "openpyxl>=3.1.5",
    "pyexcel-ods>=0.6.0",
    # ── Utilities ──
    "rich>=14.3.3",
    "psutil>=7.2.2",
    "jinja2>=3.1.6",
    "tiktoken>=0.12.0",
    "blingfire==0.1.8",
    "beautifulsoup4>=4.12.0",
    "websockets>=16.0",
    "filelock>=3.13.0",
    # ── HuggingFace Hub (for downloading ONNX models) ──
    "huggingface-hub>=0.20.0",
    # ── GPU Detection (no torch) ──
    "gputil>=1.4.0",
    "keyring>=25.7.0",
    "httpx>=0.28.1",
    "pytextrank>=3.3.0",
    "rapidocr-onnxruntime>=1.4.4",
    "tokenizers>=0.22.2",
    "pillow>=12.2.0",
    "sentencepiece>=0.2.1",
    "rapidocr>=3.8.4",
    "pyvis>=0.3.2",
    "nvidia-ml-py>=13.610.43",
    "sse-starlette>=2.2.0",
    "starlette>=1.3.0",
    "uvicorn>=0.50.0",
    "fastmcp>=3.4.2",
    "click>=8.4.0",
]

[project.scripts]
darwin = "src.cli:main"
darwin-admin = "src.admin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.deptry.package_module_name_map]
beautifulsoup4 = ["bs4"]
