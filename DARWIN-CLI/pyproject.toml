[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DARWIN"
version = "0.1.0"
description = "DARWIN-CLI a SOTA RAG ai agent for your personal and local use, it has both llm api support and bring your own model support too"
authors = [
    {name = "Brightdotdev", email = "mail.bright.dev@gmail.com"},
    {name = "Akinola Bright", email = "iamtherealbright@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blingfire==0.1.8",
    "cachetools>=7.1.2",
    "cohere>=6.1.0",
    "hdbscan>=0.8.42",
    "jinja2>=3.1.6",
    "keyring",
    "litellm>=1.83.0",
    "markitdown>=0.1.5",
    "nltk>=3.9.4",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pymupdf>=1.27.2.2",
    "pymupdf4llm>=1.27.2.2",
    "pyvis>=0.3.2",
    "rank-bm25>=0.2.2",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "spacy>=3.8.14",
    "tiktoken>=0.12.0",
    "toml>=0.10.2",
    "torch>=2.11.0",
    "trafilatura>=2.0.0",
    "transformers>=4.49.0,<5.0.0",
    "umap-learn>=0.5.12",
    "usearch>=2.25.1",
    "websockets>=16.0",
]


[tool.deptry.package_module_name_map]
umap-learn = ["umap"]


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
darwin = "agent:app"
