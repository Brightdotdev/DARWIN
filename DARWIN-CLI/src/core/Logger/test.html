<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darwin Terminal — Web UI</title>
    <style>
        :root {
            --bg: #0c0c0c;
            --surface: #141414;
            --text: #c0c0c0;
            --dim: #666;
            --cyan: #00d4d4;
            --green: #00d700;
            --yellow: #d7af00;
            --red: #d70000;
            --accent: #5f5fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- header --- */
        #header {
            background: var(--surface);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--dim);
            transition: background 0.3s;
        }
        #status-dot.connected {
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }
        #status-dot.disconnected {
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
        }

        #status-text {
            font-size: 12px;
            color: var(--dim);
        }

        #header input {
            flex: 1;
            background: var(--bg);
            border: 1px solid #333;
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        #header input:focus {
            border-color: var(--cyan);
        }

        #header button {
            background: var(--surface);
            border: 1px solid #444;
            color: var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
        }
        #header button:hover {
            background: #222;
            border-color: var(--cyan);
        }

        /* --- terminal body --- */
        #terminal {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .line.info    { color: var(--text); }
        .line.success { color: var(--green); }
        .line.warning { color: var(--yellow); }
        .line.error   { color: var(--red); }
        .line.banner  { color: var(--cyan); font-size: 13px; line-height: 1.15; }
        .line.system  { color: var(--dim); font-style: italic; }

        /* --- progress bars --- */
        .progress-block {
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .progress-bar-outer {
            flex: 1;
            height: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: var(--cyan);
            border-radius: 4px;
            transition: width 0.2s ease-out;
        }
        .progress-label {
            color: var(--cyan);
            min-width: 140px;
        }
        .progress-pct {
            color: var(--dim);
            min-width: 45px;
            text-align: right;
        }

        /* --- prompt modal --- */
        #prompt-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        #prompt-overlay.active {
            display: flex;
        }

        #prompt-box {
            background: var(--surface);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            min-width: 360px;
            max-width: 500px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }

        #prompt-message {
            color: var(--yellow);
            font-size: 15px;
            margin-bottom: 16px;
        }

        .prompt-option {
            display: block;
            width: 100%;
            background: var(--bg);
            border: 1px solid #333;
            color: var(--text);
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            transition: background 0.2s, border-color 0.2s;
        }
        .prompt-option:hover {
            background: #1a1a1a;
            border-color: var(--cyan);
        }
        .prompt-option:active {
            background: #222;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div id="header">
        <div id="status-dot" class="disconnected"></div>
        <span id="status-text">disconnected</span>
        <input id="ws-url" type="text" value="ws://localhost:8765" placeholder="WebSocket URL">
        <button id="btn-connect">connect</button>
        <button id="btn-send" style="display:none;">send test prompt</button>
    </div>

    <!-- TERMINAL OUTPUT -->
    <div id="terminal"></div>

    <!-- PROMPT MODAL -->
    <div id="prompt-overlay">
        <div id="prompt-box">
            <div id="prompt-message"></div>
            <div id="prompt-options"></div>
        </div>
    </div>

<script>
    // =========================================================================
    // DOM refs
    // =========================================================================
    const statusDot   = document.getElementById('status-dot');
    const statusText  = document.getElementById('status-text');
    const wsUrlInput  = document.getElementById('ws-url');
    const btnConnect  = document.getElementById('btn-connect');
    const terminal    = document.getElementById('terminal');
    const promptOverlay = document.getElementById('prompt-overlay');
    const promptMsg   = document.getElementById('prompt-message');
    const promptOpts  = document.getElementById('prompt-options');

    let ws = null;
    let pendingPromptId = null;

    // =========================================================================
    // Helpers
    // =========================================================================
    function setStatus(state) {
        statusDot.className = state;  // 'connected' or 'disconnected'
        statusText.textContent = state;
        btnConnect.textContent = state === 'connected' ? 'disconnect' : 'connect';
    }

    function appendLine(text, cls = 'system') {
        const div = document.createElement('div');
        div.className = `line ${cls}`;
        div.textContent = text;
        terminal.appendChild(div);
        terminal.scrollTop = terminal.scrollHeight;
    }

    // Progress trackers by id
    const progressEls = {};

    function renderProgressStart(id, label, total) {
        const container = document.createElement('div');
        container.className = 'progress-block';

        const labelSpan = document.createElement('span');
        labelSpan.className = 'progress-label';
        labelSpan.textContent = label;

        const outer = document.createElement('div');
        outer.className = 'progress-bar-outer';
        const inner = document.createElement('div');
        inner.className = 'progress-bar-inner';
        inner.style.width = '0%';
        outer.appendChild(inner);

        const pctSpan = document.createElement('span');
        pctSpan.className = 'progress-pct';
        pctSpan.textContent = '0%';

        container.appendChild(labelSpan);
        container.appendChild(outer);
        container.appendChild(pctSpan);
        terminal.appendChild(container);
        terminal.scrollTop = terminal.scrollHeight;

        progressEls[id] = { outer, inner, pctSpan, total, container };
    }

    function renderProgressUpdate(id, current, status) {
        const el = progressEls[id];
        if (!el) return;
        const pct = el.total > 0 ? Math.round((current / el.total) * 100) : 0;
        el.inner.style.width = pct + '%';
        el.pctSpan.textContent = pct + '%';
        if (status) {
            el.container.querySelector('.progress-label').textContent = status;
        }
    }

    function renderProgressEnd(id) {
        const el = progressEls[id];
        if (!el) return;
        el.inner.style.width = '100%';
        el.pctSpan.textContent = '100%';
        // Keep it visible, just mark done
        el.container.style.opacity = '0.6';
        delete progressEls[id];
    }


    function showPrompt(id, message, options) {
    // If there's already a pending prompt, hide it first
    if (pendingPromptId) {
        hidePrompt();
    }
    
    pendingPromptId = id;
    promptMsg.textContent = message;
    promptOpts.innerHTML = '';

    options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'prompt-option';
        btn.textContent = `${i + 1}. ${opt}`;
        btn.addEventListener('click', () => {
            sendPromptResponse(id, opt);
            hidePrompt();
        });
        promptOpts.appendChild(btn);
    });

    promptOverlay.classList.add('active');
    
    // Auto-dismiss after 60s if no response
    setTimeout(() => {
        if (pendingPromptId === id) {
            hidePrompt();
            appendLine('[prompt timed out]', 'system');
        }
    }, 60000);
}
    function hidePrompt() {
        promptOverlay.classList.remove('active');
        pendingPromptId = null;
    }

    function sendPromptResponse(id, choice) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
            type: 'prompt_response',
            payload: { id, choice }
        }));
    }

    // =========================================================================
    // Message handler
    // =========================================================================
    function handleMessage(raw) {
        let data;
        try {
            data = JSON.parse(raw);
        } catch {
            appendLine(`[parse error] ${raw}`, 'error');
            return;
        }

        const { type, payload } = data;

        switch (type) {
            case 'log': {
                let cls = payload.log_type || 'info';
                if (payload.style === 'banner') cls = 'banner';
                appendLine(payload.message, cls);
                break;
            }
            case 'progress': {
                const { event, id, total, label, current, status } = payload;
                if (event === 'start') {
                    renderProgressStart(id, label, total);
                } else if (event === 'update') {
                    renderProgressUpdate(id, current, status);
                } else if (event === 'end') {
                    renderProgressEnd(id);
                }
                break;
            }
            case 'prompt': {
                showPrompt(payload.id, payload.message, payload.options);
                break;
            }
            default:
                appendLine(`[unknown: ${type}] ${JSON.stringify(payload)}`, 'warning');
        }
    }

    // =========================================================================
    // WebSocket connect / disconnect
    // =========================================================================
    function connect() {
        if (ws && ws.readyState !== WebSocket.CLOSED) {
            ws.close();
            return;
        }

        const url = wsUrlInput.value.trim() || 'ws://localhost:8765';
        ws = new WebSocket(url);

        ws.onopen = () => {
            setStatus('connected');
            appendLine('connected to darwin', 'success');
        };

        ws.onmessage = (e) => handleMessage(e.data);

        ws.onerror = () => {
            appendLine('websocket error', 'error');
        };

        ws.onclose = () => {
            setStatus('disconnected');
            appendLine('disconnected', 'system');
            ws = null;
            hidePrompt();
        };
    }

    btnConnect.addEventListener('click', connect);

    // Allow pressing Enter in URL input to connect
    wsUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connect();
    });

    // =========================================================================
    // On load: auto-connect
    // =========================================================================
    connect();
</script>
</body>
</html>
