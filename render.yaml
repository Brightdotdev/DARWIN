services:
  - type: web
    name: darwin-rag
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DARWIN_BASE_DIR
        value: /data
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 10
